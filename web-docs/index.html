<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVPlot</title>
    <link rel="icon" type="image/svg+xml" href="../assets/vvplot-logo.svg" />
</head>

<body>
    <div id="app"></div>
    <script type="module">
        import './style/style.css'
        import PreHighlightElement from './script/pre-highlight.js'
        customElements.define('pre-highlight', PreHighlightElement)

        import { createApp } from 'vue'
        import App from './index.vue'
        import VVPlot from '#src/index.esm.ts'
        import { vvtheme, vvbreak, vvlabel, vvscale } from '#src/index.esm.ts'
        let app = createApp(App)
        app.use(VVPlot)
        Object.assign(app.config.globalProperties, { vvtheme, vvbreak, vvlabel, vvscale })
        app.mount('#app')
    </script>
</body>

</html>
