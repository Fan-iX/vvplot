<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVPlot</title>
    <link rel="icon" type="image/svg+xml" href="../assets/vvplot-logo.svg" />
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/article.css">
</head>

<body>
    <div id="app"></div>
    <script type="module">
        import PreHighlightElement from './script/pre-highlight.js'
        customElements.define('pre-highlight', PreHighlightElement)

        import { createApp } from 'vue'
        import App from './index.vue'
        import { components } from '#base/index.ts'
        let app = createApp(App)
        for (let c in components) {
            app.component(c, components[c])
        }
        app.mount('#app')
    </script>
</body>

</html>
